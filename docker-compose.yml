
version: "3.9"

services:
  web:
    build: .
    container_name: tododot-web
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    # 環境変数を .env から読み込みたい場合は下記を有効にしてください
    # env_file:
    #   - ./.env
    environment:
      NODE_ENV: development
      # DATABASE_URL は .env で管理するのが一般的です。
      # DATABASE_URL: "postgresql://user:password@db:5432/mydbname"
    depends_on:
      - db
    # volumes and command override removed to use Dockerfile defaults

  db:
    image: postgres:15
    container_name: tododot-db
    environment:
      POSTGRES_USER: postgres         # 必要に応じて変更してください（開発用ならそのままでも問題ありません）
      POSTGRES_PASSWORD: postgres   # 必要に応じて変更してください
      POSTGRES_DB: mydb         # 必要に応じて変更してください
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
