version: "3.8"

services:
  web:
    build: .
    container_name: tododot-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # .env を使う場合は env_file で環境変数を読み込むことも可能
      # DATABASE_URL=postgresql://user:password@db:5432/mydbname など
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev  # 開発環境でホットリロード等を行う場合、開発用コマンドを指定

  db:
    image: postgres:15
    container_name: tododot-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydbname
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
